<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دخول الدكتور</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="page">
    <div class="card">
      <h1>دخول الدكتور</h1>
      <form id="login-form" novalidate>
        <label for="username">اسم المستخدم</label>
        <input id="username" name="username" autocomplete="username" dir="ltr" required>

        <label for="password">كلمة السر</label>
        <input id="password" name="password" type="password" autocomplete="current-password" dir="ltr" required>

        <button type="submit" class="block" id="submit">دخول</button>
        <div id="msg" class="msg" role="alert"></div>
      </form>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const button = document.getElementById("submit");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMsg(msg);
      button.disabled = true;
      try {
        await api("POST", "/api/auth/login", {
          username: form.elements.username.value.trim(),
          password: form.elements.password.value,
        });
        window.location.href = "/lectures.html";
      } catch (err) {
        showError(msg, err.message);
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
